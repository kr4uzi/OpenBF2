name: Build packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            server: bf2_w32ded
          - arch: x64
            server: bf2_w64ded
    env:
      BF2_PYTHON_OUT: ${{ github.workspace }}/out/ci-python/${{ matrix.arch }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build and check the embedded Python runtime
        run: call Code\Build\python\build_python.cmd ${{ matrix.arch }}

      - name: Configure
        run: |
          call Code\Build\vsdevcmd.cmd ${{ matrix.arch }}
          if errorlevel 1 exit /b 1
          cmake --preset msvc-${{ matrix.arch }} -B out/build/ci-${{ matrix.arch }} -DBF2_GAME_DIR:PATH="%GITHUB_WORKSPACE%/out/no-game-content" -DBF2_DICE_PY_LIB:FILEPATH="%BF2_PYTHON_OUT%/dice_py.lib" -DBF2_DICE_PY_DLL:FILEPATH="%BF2_PYTHON_OUT%/dice_py.dll"

      - name: Run x86 engine and editor framework checks
        if: matrix.arch == 'x86'
        run: |
          call Code\Build\vsdevcmd.cmd x86
          if errorlevel 1 exit /b 1
          cmake --build out/build/ci-x86 --target bf2_run_checks bf2_editor_run_checks

      - name: Build the dedicated server
        run: |
          call Code\Build\vsdevcmd.cmd ${{ matrix.arch }}
          if errorlevel 1 exit /b 1
          cmake --build out/build/ci-${{ matrix.arch }} --target ${{ matrix.server }}

      - name: Build the x86 AI library
        if: matrix.arch == 'x86'
        run: |
          call Code\Build\vsdevcmd.cmd x86
          if errorlevel 1 exit /b 1
          cmake --build out/build/ci-x86 --target bf2_aidll

      # [CHOSEN, not recovered] The x64 server depends on and stages the native AI library.
      - name: Check the Windows x64 AI exports
        if: matrix.arch == 'x64'
        run: |
          call Code\Build\vsdevcmd.cmd x64
          if errorlevel 1 exit /b 1
          dumpbin /exports out\build\ci-x64\bin_client\aidll.dll > out\build\ci-x64\aidll-exports.txt
          if errorlevel 1 exit /b 1
          type out\build\ci-x64\aidll-exports.txt
          python -c "import re; from pathlib import Path; text=Path('out/build/ci-x64/aidll-exports.txt').read_text(); names=re.findall(r'^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)(?:\s*=\s*\S+)?\s*$', text, re.M); assert sorted(names)==['deinitDll', 'initDll'], names"
          if errorlevel 1 exit /b 1
          fc /b out\build\ci-x64\bin_client\aidll.dll out\build\ci-x64\bin_w64ded\aidll.dll

      # RendDX9.dll and TextureAtlasBuilder.dll, and so the client and the editor, build against the
      # April 2005 DirectX SDK or, on hosted runners without it, the D3DX fallback (Code/Build/dxsdk.cmd).
      # Only when neither is usable are the client (and on x86 the editor) skipped with a notice and left
      # out of the packages.
      - name: Locate the D3DX headers and import library
        id: dxsdk
        run: |
          rem The same call renddx9.cmd and textureatlasbuilder.cmd make: the April 2005 SDK, or
          rem without it the D3DX fallback (BF2_D3DX=auto, Code/Build/dxsdk.cmd).
          call Code\Build\dxsdk.cmd ${{ matrix.arch }} fallback
          if errorlevel 1 (
            echo ::notice title=No D3DX source::Neither the April 2005 DirectX SDK nor the D3DX fallback is usable; the ${{ matrix.arch }} client is not built on this runner.
            echo found=false>> "%GITHUB_OUTPUT%"
          ) else (
            echo found=true>> "%GITHUB_OUTPUT%"
          )
          exit /b 0

      # Keep the client/plugin and editor builds sequential within this checkout.
      - name: Build the ${{ matrix.arch }} client with plugins
        if: steps.dxsdk.outputs.found == 'true'
        run: |
          call Code\Build\vsdevcmd.cmd ${{ matrix.arch }}
          if errorlevel 1 exit /b 1
          cmake --build out/build/ci-${{ matrix.arch }} --target bf2_client

      - name: Build the x86 editor with its plugins
        if: matrix.arch == 'x86' && steps.dxsdk.outputs.found == 'true'
        run: |
          call Code\Build\vsdevcmd.cmd x86
          if errorlevel 1 exit /b 1
          cmake --build out/build/ci-x86 --target bf2_editor

      # Future Windows signing belongs here, before packaging and checksums.
      # No signing credentials or signing step are configured yet.
      - name: Check packaging fixtures
        run: python Code/Tests/test_package_release.py

      - name: Package Windows binaries
        run: python Code/Build/package_release.py --platform windows-${{ matrix.arch }} --build-dir out/build/ci-${{ matrix.arch }} --output-dir out/packages --revision "%GITHUB_SHA%" --repository "%GITHUB_REPOSITORY%" ${{ steps.dxsdk.outputs.found != 'true' && (matrix.arch == 'x86' && '--omit client --omit editor' || '--omit client') || '' }}

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-windows-${{ matrix.arch }}
          path: |
            out/packages/*.zip
            out/packages/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Windows build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-windows-${{ matrix.arch }}
          path: |
            out/ci-python/**/*.log
            out/build/ci-${{ matrix.arch }}/CMakeFiles/CMakeConfigureLog.yaml
            out/build/ci-${{ matrix.arch }}/Testing/Temporary/*.log
            out/build/ci-${{ matrix.arch }}/editor_renddx9/**/*.log
            Code/Build/obj_*_native/*.log
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build g++ libncurses-dev

      - name: Configure
        run: cmake --preset linux-x64 -B out/build/ci-linux-x64 -DBF2_GAME_DIR:PATH="$GITHUB_WORKSPACE/out/no-game-content"

      - name: Build the dedicated server and check the Python runtime
        run: cmake --build out/build/ci-linux-x64 --target bf2 dice_py_check_run

      - name: Package Linux binaries
        run: python3 Code/Build/package_release.py --platform linux-x64 --build-dir out/build/ci-linux-x64 --output-dir out/packages --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-linux-x64
          path: |
            out/packages/*.zip
            out/packages/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Linux build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-linux-x64
          path: |
            out/build/ci-linux-x64/CMakeFiles/CMakeConfigureLog.yaml
            out/build/ci-linux-x64/CMakeFiles/CMake*.log
          if-no-files-found: ignore
          retention-days: 7

  # [CHOSEN, not recovered] The macOS port: the renderer-on Metal client, the dedicated server and the
  # AI library, one leg per architecture on the Apple-silicon runner, macos-15 (x86_64 is cross-compiled, as the
  # local Intel builds cross-compile arm64). The client needs the native effect compiler, built here
  # from pinned vkd3d-shader 2.1 and MojoShader sources with the repository's patches
  # (tools/macos/nativefx/build.sh, tools/macos/vkd3d-patches).
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          brew install flex bison mingw-w64 autoconf automake libtool pkgconf cpanminus vulkan-headers spirv-headers
          # vkd3d's configure needs the Vulkan and SPIR-V headers; /opt/homebrew/include is not on the
          # compiler's default search path on Apple silicon.
          echo "CPPFLAGS=-I$(brew --prefix vulkan-headers)/include -I$(brew --prefix spirv-headers)/include" >> "$GITHUB_ENV"
          # vkd3d's configure needs Perl's JSON module.
          cpanm --notest --local-lib "$HOME/perl5" JSON
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "WIDL=$(brew --prefix mingw-w64)/toolchain-x86_64/bin/x86_64-w64-mingw32-widl" >> "$GITHUB_ENV"

      - name: Fetch the native effect sources
        run: |
          git clone --depth 1 --branch vkd3d-2.1 https://gitlab.winehq.org/wine/vkd3d.git out/third_party/vkd3d
          test "$(git -C out/third_party/vkd3d rev-parse HEAD)" = fb7f9ff3c1f8d972ee6f1b8c6a92caf6c8ba1e10
          (cd out/third_party/vkd3d && ./autogen.sh)
          git clone https://github.com/icculus/mojoshader.git out/third_party/mojoshader
          git -C out/third_party/mojoshader checkout --detach ad5dff84830c2863c841f4b1f4e3df78c705b383

      - name: Build the native effect libraries
        run: sh tools/macos/nativefx/build.sh ${{ matrix.arch }}

      - name: Configure
        run: |
          deps=nativefx
          if [ "${{ matrix.arch }}" = arm64 ]; then deps=nativefx-arm64; fi
          cmake --preset macos-x64 -B out/build/ci-macos-${{ matrix.arch }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DBF2_MACOS_LINK_RENDDX9=ON \
            -DBF2_FX_NATIVE_DEPS="$GITHUB_WORKSPACE/out/build/$deps" \
            -DBF2_GAME_DIR:PATH="$GITHUB_WORKSPACE/out/no-game-content"

      - name: Build the client, the dedicated server and the AI library
        run: cmake --build out/build/ci-macos-${{ matrix.arch }} --target bf2_client bf2 bf2_aidll

      - name: Check the architecture and the Python runtime
        run: |
          for image in bf2_client bf2 libdice_py.dylib libaidll.dylib; do
            lipo out/build/ci-macos-${{ matrix.arch }}/bin_macos/$image -verify_arch ${{ matrix.arch }}
          done
          # The runner is arm64; the cross-compiled x86_64 images are not executed here.
          if [ "${{ matrix.arch }}" = arm64 ]; then
            cmake --build out/build/ci-macos-arm64 --target dice_py_check_run
          fi

      - name: Package macOS binaries
        run: python3 Code/Build/package_release.py --platform macos-${{ matrix.arch }} --build-dir out/build/ci-macos-${{ matrix.arch }} --output-dir out/packages --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-macos-${{ matrix.arch }}
          path: |
            out/packages/*.zip
            out/packages/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload macOS build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-macos-${{ matrix.arch }}
          path: |
            out/build/ci-macos-${{ matrix.arch }}/CMakeFiles/CMakeConfigureLog.yaml
            out/build/nativefx*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # [CHOSEN, not recovered] The macOS app: the separate MIT setup app (kr4uzi/openbf2-setup, pinned
  # below) with the universal client embedded, as a drag-and-drop disk image. The two macOS legs are
  # merged with lipo; the setup app's own release script builds, tests and verifies the image. Its
  # contract for the client directory is docs/client-artifact.md in that repository.
  macos-app:
    name: macOS app (universal)
    needs: macos
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SETUP_REPOSITORY: kr4uzi/openbf2-setup
      SETUP_REVISION: 5cf108aaae0ef3ad2c9d2dd791239cf9c87fd136 # v0.1.0
    steps:
      - name: Download the macOS client packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-macos-*
          path: out/packages
          merge-multiple: true

      - name: Merge the client legs into a universal client
        working-directory: out
        run: |
          for arch in arm64 x86_64; do
            (cd packages && shasum -a 256 -c "openbf2-macos-$arch-client.zip.sha256")
            ditto -x -k "packages/openbf2-macos-$arch-client.zip" "legs/$arch"
          done
          mkdir client-universal
          for item in bf2_client libdice_py.dylib libaidll.dylib; do
            lipo -create "legs/arm64/openbf2-macos-arm64-client/$item" \
                         "legs/x86_64/openbf2-macos-x86_64-client/$item" \
                 -output "client-universal/$item"
            lipo "client-universal/$item" -verify_arch arm64 x86_64
          done
          chmod +x client-universal/bf2_client

      - name: Check out the setup app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SETUP_REPOSITORY }}
          ref: ${{ env.SETUP_REVISION }}
          path: out/openbf2-setup
          persist-credentials: false

      - name: Prepare the Rust toolchain
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked --manifest-path out/openbf2-setup/core/rtp-bridge/Cargo.toml

      - name: Build, test and package the app
        run: |
          bash out/openbf2-setup/macos/build-release.sh "$GITHUB_WORKSPACE/out/client-universal" "$GITHUB_WORKSPACE/out/packages-app/openbf2-macos-app.dmg" "$GITHUB_WORKSPACE/out/setup-build"
          cd out/packages-app
          rm -f openbf2-macos-app.dmg.sha256
          shasum -a 256 openbf2-macos-app.dmg > openbf2-macos-app.dmg.sha256

      - name: Upload the macOS app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-macos-app
          path: |
            out/packages-app/openbf2-macos-app.dmg
            out/packages-app/openbf2-macos-app.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
